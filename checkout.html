<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Medo Book Store</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <div class="checkout-container">
        <header>
            <h1>Checkout</h1>
            <p>Please enter your details to complete your purchase</p>
        </header>

        <form action="1.html" class="checkout-form">
            <div class="form-section">
                <h2>Personal Information</h2>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Medo" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="medo@example.com" required>
            </div>

            <div class="form-section">
                <h2>Shipping Address</h2>
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="123 Book St" required>

                <label for="city">City</label>
                <input type="text" id="city" placeholder="Cairo" required>
            </div>

            <div class="form-section">
                <h2>Payment Details</h2>
                <label for="card">Card Number</label>
                <input type="text" id="card" placeholder="1234 5678 9101 1121" required>

                <div class="payment-row">
                    <div>
                        <label for="expiry">Expiry Date</label>
                        <input type="text" id="expiry" placeholder="MM/YY" required>
                    </div>
                    <div>
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" placeholder="123" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="confirm-btn">Confirm Order</button>
        </form>
    </div>
    <script src="checkout.js"></script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This is our book store you can buy anything you want with a good price">
  <title>Medo Book Store - Log In</title>
  <link rel="stylesheet" href="2.css">
</head>
<body>
  <div class="login-card">
    <div class="header">
      <img src="Lucid_Origin_Create_a_professional_logo_for_Medo_Book_Store_wi_3.jpg" alt="Book Store Logo">
      <h1>Medo Book store</h1>   
      <h2>Welcome to my book store</h2>
      <p>Here you can find a variety of books at great prices.</p> 
    </div>
    <div class="login-container">
      <form method="get" action="1.html">
        <div>
          <label for="username">Username:</label>
          <input type="text" required placeholder="Enter your username" name="user" id="username">
        </div>
        <div>
          <label for="password">Password:</label>
          <input type="password" required placeholder="Enter your password" name="pass" id="password">
        </div>
        <div>
          <label for="email">Email:</label>
          <input type="email" required placeholder="Enter your email" name="email" id="email">
        </div>
        <div style="text-align:center;">
          <button type="submit">Log In</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
